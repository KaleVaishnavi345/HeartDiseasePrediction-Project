<!DOCTYPE html>
<html>
<head>
    <title>Register - Heart Disease System</title>
    <style>
        body {
            margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: url('/static/images/registration-bg.jpeg') no-repeat center center fixed;
            background-size: cover; font-family: 'Segoe UI', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 40px; border-radius: 25px; width: 350px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); color: #333;
        }
        input { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 8px; background: rgba(255,255,255,0.8); color: #333; }
        button { width: 100%; padding: 12px; background: #ff5252; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .flash-msg { background: rgba(255,255,255,0.3); padding: 10px; border-radius: 5px; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2 style="text-align: center;">Create Account</h2>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash-msg">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="tel" name="phone" placeholder="Mobile Number" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Register</button>
        </form>
        <p style="text-align: center; margin-top: 15px;">Already have an account? <a href="/login" style="color: white;">Login</a></p>
    </div>
</body>
</html>
