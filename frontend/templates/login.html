<!DOCTYPE html>
<html>
<head>
    <title>Login - Heart Disease System</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
        .split-container { display: flex; height: 100vh; }
        .visual-side {
            flex: 1;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('/static/images/login-bg.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        .form-side { flex: 1; background-color: #b2e2e0; display: flex; justify-content: center; align-items: center; }
        .card { background: white; padding: 40px; border-radius: 20px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #006064; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .error-msg { color: #d32f2f; font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="split-container">
        <div class="visual-side">
            <h1 style="font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">Heart Disease<br>Prediction</h1>
        </div>
        <div class="form-side">
            <div class="card">
                <h2>Welcome Back</h2>
                
                {% with messages = get_flashed_messages() %}
                  {% if messages %}
                    <div class="error-msg">{{ messages[0] }}</div>
                  {% endif %}
                {% endwith %}

                <form action="/login" method="POST">
                    <input type="email" name="email" placeholder="Email Address" required>
                    <input type="password" name="password" placeholder="Password" required>
                    <button type="submit">Login</button>
                </form>
                <p>New user? <a href="/register">Register here</a></p>
            </div>
        </div>
    </div>
</body>
</html>
